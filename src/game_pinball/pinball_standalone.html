<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>Neon Drop Race</title>
  <style>
:root {
  --bg: #090b12;
  --panel: rgba(18, 23, 36, 0.84);
  --panel-strong: rgba(24, 30, 48, 0.96);
  --text: #f7fbff;
  --muted: #9aa9bc;
  --line: rgba(255, 255, 255, 0.12);
  --cyan: #54f0ff;
  --pink: #ff4fd8;
  --lime: #b8ff5f;
  --gold: #ffd166;
  --danger: #ff6b6b;
  color-scheme: dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background:
    radial-gradient(circle at 24% 10%, rgba(84, 240, 255, 0.15), transparent 28%),
    radial-gradient(circle at 80% 20%, rgba(255, 79, 216, 0.11), transparent 26%),
    linear-gradient(180deg, #0b101c 0%, #070910 58%, #05060a 100%);
  color: var(--text);
  touch-action: manipulation;
}

button,
textarea {
  font: inherit;
}

button {
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  color: var(--text);
  font-weight: 800;
  letter-spacing: 0;
  cursor: pointer;
  transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
}

button:active {
  transform: translateY(1px) scale(0.99);
}

button:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(84, 240, 255, 0.65);
  outline-offset: 2px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

.primary {
  border: 0;
  color: #051017;
  background: linear-gradient(135deg, var(--cyan), var(--lime));
  box-shadow: 0 0 28px rgba(84, 240, 255, 0.25);
}

.app {
  position: relative;
  width: 100vw;
  height: 100dvh;
  min-height: 100dvh;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: flex;
}

.setup-screen,
.result-screen {
  flex-direction: column;
  gap: 14px;
  padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
  overflow-y: auto;
}

.brand-block {
  padding-top: 14px;
}

.kicker {
  margin: 0 0 4px;
  color: var(--cyan);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.14em;
}

h1,
h2 {
  margin: 0;
  line-height: 0.96;
  letter-spacing: 0;
}

h1 {
  max-width: 10ch;
  font-size: clamp(48px, 16vw, 76px);
  text-shadow: 0 0 22px rgba(84, 240, 255, 0.28);
}

h2 {
  font-size: clamp(42px, 13vw, 68px);
}

.subtitle,
.hint,
.error {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.45;
}

.error {
  min-height: 20px;
  color: var(--danger);
  font-weight: 700;
}

.field-label {
  margin-top: 6px;
  color: var(--text);
  font-size: 14px;
  font-weight: 800;
}

textarea {
  width: 100%;
  min-height: 180px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  background: rgba(5, 7, 12, 0.72);
  color: var(--text);
  line-height: 1.55;
}

.setup-row,
.panel-title,
.race-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.count-pill {
  min-width: 54px;
  padding: 5px 9px;
  border: 1px solid rgba(84, 240, 255, 0.35);
  border-radius: 999px;
  color: var(--cyan);
  text-align: center;
  font-size: 12px;
  font-weight: 900;
}

.participant-preview {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.participant-chip {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.button-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: auto;
}

.race-screen {
  flex-direction: column;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  gap: 8px;
}

.race-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 58px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  backdrop-filter: blur(16px);
}

.race-header strong {
  display: block;
  max-width: 210px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 18px;
}

.race-actions {
  display: flex;
  gap: 8px;
}

.icon-button {
  width: 46px;
  min-width: 46px;
  padding: 0;
  font-size: 20px;
}

.race-meta {
  min-height: 34px;
  padding: 0 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.game-viewport {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  border: 1px solid rgba(84, 240, 255, 0.22);
  border-radius: 8px;
  overflow: hidden;
  background: #070a12;
  box-shadow: inset 0 0 50px rgba(84, 240, 255, 0.08), 0 0 30px rgba(255, 79, 216, 0.08);
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.countdown {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  color: #fff;
  font-size: clamp(64px, 22vw, 118px);
  font-weight: 1000;
  text-shadow: 0 0 34px rgba(84, 240, 255, 0.6);
}

.countdown.pulse {
  animation: pulse 620ms ease both;
}

.rank-panel {
  flex: 0 0 auto;
  max-height: 28dvh;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  overflow: hidden;
}

.panel-title {
  padding: 9px 10px 7px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.08em;
}

#liveRanking {
  list-style: none;
  margin: 0;
  padding: 6px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 5px;
  overflow-y: auto;
  max-height: calc(28dvh - 34px);
}

#liveRanking li {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 7px;
  padding: 7px;
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.055);
  transition: transform 180ms ease, background 180ms ease;
}

#liveRanking li.leader {
  background: rgba(84, 240, 255, 0.16);
}

.rank-num,
.marble-dot {
  flex: 0 0 auto;
}

.rank-num {
  width: 22px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 900;
}

.marble-dot {
  width: 14px;
  height: 14px;
  border-radius: 999px;
  box-shadow: 0 0 12px currentColor;
}

.rank-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 800;
}

.result-screen {
  text-align: center;
}

.podium {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: end;
  gap: 8px;
  min-height: 160px;
}

.podium-card {
  display: flex;
  min-width: 0;
  min-height: 98px;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 6px;
  background: var(--panel-strong);
}

.podium-card.first {
  min-height: 138px;
  border-color: rgba(255, 209, 102, 0.6);
  box-shadow: 0 0 30px rgba(255, 209, 102, 0.12);
}

.medal {
  color: var(--gold);
  font-size: 26px;
  font-weight: 1000;
}

.podium-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 900;
}

.result-table-wrap {
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: auto;
  background: var(--panel);
}

.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.result-table th,
.result-table td {
  padding: 10px 8px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  text-align: left;
}

.result-table th {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
}

.result-actions {
  margin-top: 0;
}

.shake {
  animation: shake 300ms ease;
}

.flash {
  animation: flash 420ms ease;
}

@keyframes pulse {
  from { transform: scale(0.82); opacity: 0; }
  45% { opacity: 1; }
  to { transform: scale(1.12); opacity: 0; }
}

@keyframes shake {
  0%, 100% { transform: translate3d(0, 0, 0); }
  25% { transform: translate3d(-4px, 2px, 0); }
  50% { transform: translate3d(4px, -1px, 0); }
  75% { transform: translate3d(-2px, 1px, 0); }
}

@keyframes flash {
  0% { box-shadow: inset 0 0 0 rgba(84, 240, 255, 0); }
  45% { box-shadow: inset 0 0 80px rgba(84, 240, 255, 0.24); }
  100% { box-shadow: inset 0 0 0 rgba(84, 240, 255, 0); }
}

@media (min-width: 720px) {
  .setup-screen,
  .result-screen {
    width: min(460px, 100vw);
    margin: 0 auto;
  }

  .race-screen {
    width: min(480px, 100vw);
    margin: 0 auto;
  }
}

@media (orientation: landscape) and (max-height: 540px) {
  .race-screen {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) 250px;
    grid-template-rows: auto auto 1fr;
  }

  .race-header,
  .race-meta {
    grid-column: 1 / 3;
  }

  .rank-panel {
    max-height: none;
  }

  #liveRanking {
    grid-template-columns: 1fr;
    max-height: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    scroll-behavior: auto !important;
    transition-duration: 1ms !important;
  }
}

</style>
</head>
<body>
  <div id="app" class="app">
    <section id="setupScreen" class="screen setup-screen active" aria-labelledby="gameTitle">
      <div class="brand-block">
        <p class="kicker">FINAL RACE</p>
        <h1 id="gameTitle">NEON DROP RACE</h1>
        <p class="subtitle">한 번의 구슬 경주로 결정되는 최종 순위</p>
      </div>

      <label class="field-label" for="participantInput">참가자 이름</label>
      <textarea id="participantInput" rows="8" spellcheck="false" aria-describedby="participantHelp"></textarea>
      <div class="setup-row">
        <span id="participantHelp" class="hint">줄마다 한 명씩 입력, 2-16명</span>
        <span id="participantCount" class="count-pill">0명</span>
      </div>
      <p id="setupError" class="error" role="alert"></p>

      <div id="participantPreview" class="participant-preview" aria-label="참가자 목록"></div>

      <div class="button-grid">
        <button id="startButton" class="primary" type="button" aria-label="경기 시작">경기 시작</button>
        <button id="sampleButton" type="button" aria-label="예시 참가자 입력">예시 입력</button>
        <button id="resetButton" type="button" aria-label="저장 데이터 초기화">전체 초기화</button>
      </div>
    </section>

    <section id="raceScreen" class="screen race-screen" aria-label="경기 화면">
      <header class="race-header">
        <div>
          <p class="kicker">FINAL RACE</p>
          <strong id="currentLeader">대기 중</strong>
        </div>
        <div class="race-actions">
          <button id="soundButton" class="icon-button" type="button" aria-label="소리 켜기 또는 끄기">♪</button>
          <button id="fullscreenButton" class="icon-button" type="button" aria-label="전체 화면">⛶</button>
        </div>
      </header>

      <div class="race-meta">
        <span id="timerText">00.00</span>
        <span id="seedText">SEED -</span>
      </div>

      <main id="gameViewport" class="game-viewport">
        <canvas id="gameCanvas" aria-label="구슬 경주 코스"></canvas>
        <div id="countdownOverlay" class="countdown" aria-live="polite"></div>
      </main>

      <aside class="rank-panel" aria-label="실시간 순위">
        <div class="panel-title">
          <span>LIVE RANKING</span>
          <span id="raceStateText">READY</span>
        </div>
        <ol id="liveRanking"></ol>
      </aside>
    </section>

    <section id="resultScreen" class="screen result-screen" aria-labelledby="winnerName">
      <p class="kicker">RACE COMPLETE</p>
      <h2 id="winnerName">우승자</h2>
      <p id="resultMeta" class="subtitle"></p>

      <div id="podium" class="podium" aria-label="상위 3명"></div>

      <div class="result-table-wrap">
        <table class="result-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>참가자</th>
              <th>기록</th>
            </tr>
          </thead>
          <tbody id="resultRows"></tbody>
        </table>
      </div>

      <div class="button-grid result-actions">
        <button id="rerunButton" class="primary" type="button">다시 경기</button>
        <button id="editButton" type="button">참가자 편집</button>
        <button id="saveImageButton" type="button">결과 이미지 저장</button>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script>
(() => {
  'use strict';

  if (!window.Matter) {
    const error = document.getElementById('setupError');
    const start = document.getElementById('startButton');
    if (error) error.textContent = 'Matter.js를 불러오지 못했습니다. 인터넷 연결 또는 로컬 라이브러리 설정을 확인하세요.';
    if (start) start.disabled = true;
    return;
  }

  const { Engine, World, Bodies, Body, Composite, Events, Vector } = Matter;

  const GameState = {
    SETUP: 'setup',
    READY: 'ready',
    COUNTDOWN: 'countdown',
    RUNNING: 'running',
    FINISHED: 'finished'
  };

  const STORAGE_KEY = 'neon-drop-race:v1';
  const COURSE = { width: 390, height: 2380, finishY: 2266 };
  const PATH_NODES = [
    { y: 0, center: 195, width: 332 },
    { y: 150, center: 150, width: 290 },
    { y: 315, center: 236, width: 346 },
    { y: 485, center: 166, width: 278 },
    { y: 655, center: 232, width: 338 },
    { y: 820, center: 154, width: 286 },
    { y: 990, center: 228, width: 350 },
    { y: 1160, center: 176, width: 300 },
    { y: 1330, center: 238, width: 336 },
    { y: 1500, center: 150, width: 276 },
    { y: 1680, center: 226, width: 346 },
    { y: 1855, center: 164, width: 284 },
    { y: 2030, center: 232, width: 352 },
    { y: 2180, center: 178, width: 292 },
    { y: 2266, center: 195, width: 322 },
    { y: 2380, center: 195, width: 322 }
  ];
  const BALL_RADIUS = 15;
  const MAX_RACE_MS = 65000;
  const STUCK_NUDGE_MS = 1200;
  const STUCK_RESCUE_MS = 3000;
  const MIN_SIDE_GAP = BALL_RADIUS * 3.4;
  const MIN_VERTICAL_OBSTACLE_GAP = 118;
  const COLORS = [
    '#54f0ff', '#ff4fd8', '#b8ff5f', '#ffd166',
    '#7c8cff', '#ff8a5c', '#4dffa8', '#ff5d7a',
    '#b967ff', '#6ee7f9', '#f8f871', '#7df9c4',
    '#f5a3ff', '#9bc7ff', '#ffb86b', '#d1ff72'
  ];
  const SAMPLE_NAMES = ['김민수', '이영희', '박서준', '최지우', '정하늘', '오유진', '강도윤', '한서아'];

  const $ = (id) => document.getElementById(id);
  const ui = {
    setupScreen: $('setupScreen'),
    raceScreen: $('raceScreen'),
    resultScreen: $('resultScreen'),
    input: $('participantInput'),
    participantCount: $('participantCount'),
    participantPreview: $('participantPreview'),
    setupError: $('setupError'),
    startButton: $('startButton'),
    sampleButton: $('sampleButton'),
    resetButton: $('resetButton'),
    soundButton: $('soundButton'),
    fullscreenButton: $('fullscreenButton'),
    canvas: $('gameCanvas'),
    viewport: $('gameViewport'),
    countdown: $('countdownOverlay'),
    timerText: $('timerText'),
    seedText: $('seedText'),
    currentLeader: $('currentLeader'),
    raceStateText: $('raceStateText'),
    liveRanking: $('liveRanking'),
    winnerName: $('winnerName'),
    resultMeta: $('resultMeta'),
    podium: $('podium'),
    resultRows: $('resultRows'),
    rerunButton: $('rerunButton'),
    editButton: $('editButton'),
    saveImageButton: $('saveImageButton')
  };

  const ctx = ui.canvas.getContext('2d', { alpha: false });

  function createSeededRandom(seed) {
    let t = seed >>> 0;
    return function random() {
      t += 0x6D2B79F5;
      let x = Math.imul(t ^ (t >>> 15), t | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashSeed(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i += 1) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h ^ Date.now()) >>> 0;
  }

  function formatTime(ms) {
    const safe = Math.max(0, ms || 0);
    return (safe / 1000).toFixed(2).padStart(5, '0');
  }

  function shortName(name) {
    const trimmed = name.trim();
    if (!trimmed) return '?';
    const chars = Array.from(trimmed);
    return chars.length <= 3 ? trimmed : chars.slice(0, 3).join('');
  }

  function sanitizeName(name) {
    return name.trim().replace(/\s+/g, ' ').slice(0, 24);
  }

  function normalizeParticipants(raw) {
    const seen = new Map();
    const names = raw.split(/\n+/).map(sanitizeName).filter(Boolean).slice(0, 16);
    return names.map((name) => {
      const count = seen.get(name) || 0;
      seen.set(name, count + 1);
      return count ? `${name} ${count + 1}` : name;
    });
  }

  class AudioManager {
    constructor() {
      this.enabled = true;
      this.context = null;
      this.lastSound = new Map();
    }

    restore(saved) {
      this.enabled = saved !== false;
      ui.soundButton.textContent = this.enabled ? '♪' : '×';
    }

    activate() {
      if (!this.enabled || this.context) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.context = new AudioContext();
    }

    toggle() {
      this.enabled = !this.enabled;
      ui.soundButton.textContent = this.enabled ? '♪' : '×';
      saveLocal({ soundEnabled: this.enabled });
      if (this.enabled) this.activate();
    }

    beep(type = 'tick', strength = 0.45) {
      if (!this.enabled) return;
      this.activate();
      if (!this.context) return;
      const now = performance.now();
      const last = this.lastSound.get(type) || 0;
      if (now - last < 75) return;
      this.lastSound.set(type, now);

      const table = {
        tick: [620, 0.06],
        start: [220, 0.18],
        bump: [150, 0.04],
        hit: [96, 0.08],
        finish: [860, 0.22],
        win: [440, 0.34]
      };
      const [freq, length] = table[type] || table.tick;
      const osc = this.context.createOscillator();
      const gain = this.context.createGain();
      osc.type = type === 'hit' ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(freq, this.context.currentTime);
      gain.gain.setValueAtTime(0.0001, this.context.currentTime);
      gain.gain.exponentialRampToValueAtTime(Math.min(0.12, strength * 0.18), this.context.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.context.currentTime + length);
      osc.connect(gain).connect(this.context.destination);
      osc.start();
      osc.stop(this.context.currentTime + length + 0.02);
    }
  }

  class RaceGame {
    constructor() {
      this.state = GameState.SETUP;
      this.engine = null;
      this.participants = [];
      this.finishRecords = [];
      this.dynamicObstacles = [];
      this.particles = [];
      this.random = Math.random;
      this.pathNodes = PATH_NODES;
      this.seed = 0;
      this.startTime = 0;
      this.lastFrame = 0;
      this.lastRankUpdate = 0;
      this.cameraY = 0;
      this.shake = 0;
      this.frameId = 0;
      this.resizeObserver = new ResizeObserver(() => this.resize());
      this.resizeObserver.observe(ui.viewport);
    }

    prepare(names) {
      this.cleanup();
      this.state = GameState.READY;
      this.seed = hashSeed(names.join('|'));
      this.random = createSeededRandom(this.seed);
      this.pathNodes = this.createRacePath();
      this.participants = names.map((name, index) => ({
        id: `participant-${index + 1}`,
        name,
        shortName: shortName(name),
        number: index + 1,
        color: COLORS[index % COLORS.length],
        finished: false,
        rank: null,
        finishTime: null,
        checkpoint: 0,
        body: null,
        progress: 0,
        lastSafetyY: 0,
        stalledSince: 0
      }));
      this.finishRecords = [];
      this.dynamicObstacles = [];
      this.particles = [];
      this.cameraY = 0;

      this.engine = Engine.create({ enableSleeping: false });
      this.engine.gravity.y = 0.92;
      this.engine.positionIterations = 8;
      this.engine.velocityIterations = 6;
      this.buildCourse();
      this.createBalls();
      this.bindCollisions();
      this.resize();
      ui.seedText.textContent = `SEED ${this.seed}`;
      ui.raceStateText.textContent = 'READY';
      this.updateRanking(true);
      showScreen('race');
      this.countdown();
    }

    buildCourse() {
      const world = this.engine.world;
      world.gravity.y = 0.92;
      const wallOpt = { isStatic: true, friction: 0.12, restitution: 0.34, renderTag: 'guard' };
      World.add(world, [
        Bodies.rectangle(-12, COURSE.height / 2, 24, COURSE.height, wallOpt),
        Bodies.rectangle(COURSE.width + 12, COURSE.height / 2, 24, COURSE.height, wallOpt),
        Bodies.rectangle(COURSE.width / 2, -30, COURSE.width, 60, wallOpt)
      ]);
      this.buildPathWalls();

      const addRect = (x, y, w, h, angle = 0, tag = 'rail') => {
        const body = Bodies.rectangle(x, y, w, h, {
          isStatic: true,
          angle,
          friction: 0.08,
          restitution: 0.45,
          renderTag: tag
        });
        World.add(world, body);
        return body;
      };
      const addCircle = (x, y, r, tag = 'peg') => {
        const body = Bodies.circle(x, y, r, {
          isStatic: true,
          friction: 0.04,
          restitution: 0.72,
          renderTag: tag
        });
        World.add(world, body);
        return body;
      };
      const addPathRect = (y, w, h, angle = 0, tag = 'rail', offset = 0) => {
        const path = this.pathAt(y);
        const maxSafeWidth = Math.max(54, path.width - MIN_SIDE_GAP * 2);
        const safeWidth = Math.min(w, path.width * 0.42, maxSafeWidth);
        const maxOffset = Math.max(0, path.width / 2 - safeWidth / 2 - MIN_SIDE_GAP);
        const safeOffset = Math.max(-maxOffset, Math.min(maxOffset, offset));
        const safeAngle = Math.max(-0.24, Math.min(0.24, angle));
        return addRect(path.center + safeOffset, y, safeWidth, h, safeAngle, tag);
      };

      this.addRandomStartPins(addCircle);
      this.addSafeRaceObstacles(addCircle, addPathRect, addRect);

      const finishPath = this.pathAt(COURSE.finishY);
      World.add(world, Bodies.rectangle(finishPath.center, COURSE.finishY, finishPath.width - 36, 10, {
        isStatic: true,
        isSensor: true,
        label: 'finish',
        renderTag: 'finish'
      }));
    }

    pathAt(y) {
      const nodes = this.pathNodes || PATH_NODES;
      let a = nodes[0];
      let b = nodes[nodes.length - 1];
      for (let i = 0; i < nodes.length - 1; i += 1) {
        if (y >= nodes[i].y && y <= nodes[i + 1].y) {
          a = nodes[i];
          b = nodes[i + 1];
          break;
        }
      }
      const span = Math.max(1, b.y - a.y);
      const t = Math.max(0, Math.min(1, (y - a.y) / span));
      const smooth = t * t * (3 - 2 * t);
      return {
        center: a.center + (b.center - a.center) * smooth,
        width: a.width + (b.width - a.width) * smooth
      };
    }

    createRacePath() {
      return PATH_NODES.map((node, index) => {
        if (index === 0 || index === PATH_NODES.length - 1) return { ...node };
        const isNarrow = node.width < 300;
        const isWide = node.width > 335;
        const widthJitter = isNarrow ? 18 : isWide ? 24 : 30;
        const width = Math.max(270, Math.min(356, node.width + (this.random() - 0.5) * widthJitter));
        const wiggle = index % 2 === 0 ? 18 : 24;
        const center = Math.max(18 + width / 2, Math.min(COURSE.width - 18 - width / 2, node.center + (this.random() - 0.5) * wiggle));
        return { y: node.y, center, width };
      });
    }

    buildPathWalls() {
      const railThickness = 10;
      const points = [];
      for (let y = 0; y <= COURSE.height; y += 46) {
        const p = this.pathAt(y);
        points.push({
          y,
          left: p.center - p.width / 2,
          right: p.center + p.width / 2
        });
      }
      const addRail = (x1, y1, x2, y2) => {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const length = Math.hypot(dx, dy) + 4;
        const x = (x1 + x2) / 2;
        const y = (y1 + y2) / 2;
        const angle = Math.atan2(dy, dx);
        World.add(this.engine.world, Bodies.rectangle(x, y, length, railThickness, {
          isStatic: true,
          angle,
          friction: 0.035,
          restitution: 0.52,
          renderTag: 'wall'
        }));
      };
      for (let i = 0; i < points.length - 1; i += 1) {
        addRail(points[i].left, points[i].y, points[i + 1].left, points[i + 1].y);
        addRail(points[i].right, points[i].y, points[i + 1].right, points[i + 1].y);
      }
    }

    addSafeRaceObstacles(addCircle, addPathRect, addRect) {
      const occupiedY = [];
      const reserveY = (y) => {
        if (occupiedY.some((otherY) => Math.abs(otherY - y) < MIN_VERTICAL_OBSTACLE_GAP)) return false;
        occupiedY.push(y);
        return true;
      };
      const randomInBand = (min, max) => min + this.random() * (max - min);
      const chooseOffset = (y, width, side) => {
        const path = this.pathAt(y);
        const maxOffset = Math.max(0, path.width / 2 - Math.min(width, path.width * 0.42) / 2 - MIN_SIDE_GAP);
        return side * maxOffset * (0.55 + this.random() * 0.35);
      };
      const addSingleRail = (bandMin, bandMax, side, width = 118) => {
        for (let tries = 0; tries < 8; tries += 1) {
          const y = randomInBand(bandMin, bandMax);
          if (!reserveY(y)) continue;
          const angleSign = side || (this.random() > 0.5 ? 1 : -1);
          const angle = angleSign * (0.11 + this.random() * 0.11);
          addPathRect(y, width, 14 + this.random() * 3, angle, 'rail', chooseOffset(y, width, -angleSign));
          return;
        }
      };

      addSingleRail(660, 790, -1, 120);
      addSingleRail(835, 970, 1, 112);
      addSingleRail(1000, 1080, 0, 92);
      this.addPinField(addCircle, 680, 1080, 62, 4, 7, 10, occupiedY);

      const swingBands = [
        { min: 1160, max: 1235, offset: 0, width: 88 },
        { min: 1325, max: 1405, offset: this.random() > 0.5 ? -48 : 48, width: 78 }
      ];
      for (const band of swingBands) {
        const y = randomInBand(band.min, band.max);
        if (!reserveY(y)) continue;
        const spinner = addPathRect(y, band.width, 11, 0, 'spinner', band.offset);
        this.dynamicObstacles.push({
          body: spinner,
          kind: 'swing',
          baseAngle: (this.random() - 0.5) * 0.12,
          phase: this.random() * 6.28,
          speed: 1.25 + this.random() * 0.55,
          amplitude: 0.22 + this.random() * 0.12
        });
      }
      this.addPinField(addCircle, 1120, 1440, 64, 4, 7, 10, occupiedY);

      for (let y = 1480; y < 1660; y += 82) {
        const path = this.pathAt(y);
        addCircle(path.center - path.width * 0.26, y, 16, 'bumper');
        addCircle(path.center, y + 38, 18, 'bumper');
        addCircle(path.center + path.width * 0.26, y, 16, 'bumper');
      }
      this.addPinField(addCircle, 1660, 1880, 58, 4, 6, 9, occupiedY);

      const platformY = randomInBand(1760, 1835);
      const platformPath = this.pathAt(platformY);
      const platformWidth = Math.min(102, platformPath.width * 0.32);
      const platform = addRect(platformPath.center, platformY, platformWidth, 13, (this.random() - 0.5) * 0.12, 'mover');
      this.dynamicObstacles.push({
        body: platform,
        kind: 'slide',
        baseX: platformPath.center,
        y: platformY,
        phase: this.random() * 6.28,
        span: Math.min(34, platformPath.width * 0.12)
      });

      addSingleRail(1920, 1995, -1, 112);
      addSingleRail(2050, 2125, 1, 118);
      this.addPinField(addCircle, 1900, 2120, 58, 4, 6, 9, occupiedY);

      for (let y = 2160; y < 2240; y += 52) {
        const path = this.pathAt(y);
        addCircle(path.center - path.width * 0.16, y, 8);
        addCircle(path.center + path.width * 0.16, y + 22, 8);
      }
      this.addPinField(addCircle, 2180, COURSE.finishY - 42, 48, 4, 5, 7, occupiedY);
      this.addSideDeflectors(addCircle, 640, COURSE.finishY - 120, 118);
    }

    addPinField(addCircle, startY, endY, rowGap, maxPinsPerRow, minRadius, maxRadius, blockedY = []) {
      const placed = [];
      for (let y = startY; y <= endY; y += rowGap) {
        if (blockedY.some((obstacleY) => Math.abs(obstacleY - y) < 54)) continue;
        const path = this.pathAt(y);
        const rowShift = (this.random() - 0.5) * 22;
        const count = 2 + Math.floor(this.random() * Math.max(1, maxPinsPerRow - 1));
        const left = path.center - path.width / 2 + MIN_SIDE_GAP + 18;
        const right = path.center + path.width / 2 - MIN_SIDE_GAP - 18;
        const usable = Math.max(90, right - left);
        for (let i = 0; i < count; i += 1) {
          const laneT = (i + 0.5) / count;
          const stagger = ((i % 2 ? 1 : -1) * this.random() * 10) + rowShift;
          const x = left + usable * laneT + stagger;
          const radius = minRadius + Math.floor(this.random() * (maxRadius - minRadius + 1));
          const tooClose = placed.some((pin) => Math.hypot(pin.x - x, pin.y - y) < BALL_RADIUS * 2.65 + radius);
          if (!tooClose && x > left && x < right) {
            placed.push({ x, y, radius });
            addCircle(x, y, radius, 'peg');
          }
        }
      }
    }

    addSideDeflectors(addCircle, startY, endY, rowGap) {
      for (let y = startY; y <= endY; y += rowGap) {
        const path = this.pathAt(y);
        const side = Math.floor((y - startY) / rowGap) % 2 === 0 ? -1 : 1;
        const edge = side < 0 ? path.center - path.width / 2 : path.center + path.width / 2;
        const x = edge - side * (MIN_SIDE_GAP + 28 + this.random() * 10);
        addCircle(x, y + (this.random() - 0.5) * 22, 7, 'peg');
      }
    }

    addRandomStartPins(addCircle) {
      const pins = [];
      const rows = 7;
      for (let row = 0; row < rows; row += 1) {
        const y = 140 + row * 72 + this.random() * 26;
        const path = this.pathAt(y);
        const count = 3 + Math.floor(this.random() * 3);
        const usableLeft = path.center - path.width / 2 + 38;
        const usableRight = path.center + path.width / 2 - 38;
        const usableWidth = Math.max(120, usableRight - usableLeft);
        for (let i = 0; i < count; i += 1) {
          const base = usableLeft + usableWidth * ((i + 0.5) / count);
          const x = base + (this.random() - 0.5) * Math.min(44, usableWidth / count * 0.7);
          const radius = 8 + Math.floor(this.random() * 6);
          const tooClose = pins.some((pin) => Math.hypot(pin.x - x, pin.y - y) < BALL_RADIUS * 2.5 + radius);
          if (!tooClose) {
            pins.push({ x, y, radius });
            addCircle(x, y, radius, 'peg');
          }
        }
      }
    }

    createBalls() {
      const shuffled = [...this.participants].sort(() => this.random() - 0.5);
      const total = shuffled.length;
      shuffled.forEach((participant, order) => {
        const startPath = this.pathAt(54);
        const gap = Math.min(34, (startPath.width - 78) / Math.max(1, total - 1));
        const startX = startPath.center - gap * (total - 1) / 2 + gap * order + (this.random() - 0.5) * 4;
        const body = Bodies.circle(startX, 54 + (order % 2) * 2, BALL_RADIUS, {
          label: participant.id,
          restitution: 0.55,
          friction: 0.02,
          frictionAir: 0.003,
          density: 0.004,
          sleepThreshold: Infinity,
          renderTag: 'ball'
        });
        participant.body = body;
        body.participant = participant;
        Body.setVelocity(body, { x: 0, y: 0 });
        World.add(this.engine.world, body);
      });
    }

    bindCollisions() {
      Events.on(this.engine, 'collisionStart', (event) => {
        for (const pair of event.pairs) {
          const bodies = [pair.bodyA, pair.bodyB];
          const ball = bodies.find((body) => body.participant);
          const other = bodies.find((body) => !body.participant);
          if (!ball || !other) continue;
          const participant = ball.participant;
          const speed = Vector.magnitude(ball.velocity);
          if (other.label === 'finish') {
            this.recordFinish(participant);
            continue;
          }
          if (speed > 6) {
            this.shake = Math.min(12, this.shake + 2.4);
            this.addParticles(ball.position.x, ball.position.y, participant.color, 5);
            audio.beep(other.renderTag === 'bumper' ? 'hit' : 'bump', Math.min(1, speed / 12));
          }
        }
      });
    }

    countdown() {
      this.state = GameState.COUNTDOWN;
      ui.raceStateText.textContent = 'COUNTDOWN';
      let index = 0;
      const steps = ['3', '2', '1', 'GO!'];
      const tick = () => {
        ui.countdown.textContent = steps[index];
        ui.countdown.classList.remove('pulse');
        void ui.countdown.offsetWidth;
        ui.countdown.classList.add('pulse');
        audio.beep(index < 3 ? 'tick' : 'start');
        index += 1;
        if (index <= steps.length) {
          setTimeout(tick, 720);
        } else {
          ui.countdown.textContent = '';
          this.start();
        }
      };
      tick();
    }

    start() {
      this.state = GameState.RUNNING;
      this.startTime = performance.now();
      this.lastFrame = this.startTime;
      ui.raceStateText.textContent = 'RUNNING';
      this.frameId = requestAnimationFrame((time) => this.loop(time));
    }

    loop(time) {
      if (this.state !== GameState.RUNNING) return;
      const delta = Math.min(33.33, time - this.lastFrame || 16.67);
      this.lastFrame = time;
      this.updateDynamic(time);
      Engine.update(this.engine, delta);
      this.applySafety(time);
      this.updateCamera();
      this.updateParticles(delta);
      if (time - this.lastRankUpdate > 140) {
        this.updateRanking(false);
        this.lastRankUpdate = time;
      }
      this.render(time);
      ui.timerText.textContent = formatTime(time - this.startTime);
      if (time - this.startTime > MAX_RACE_MS) this.forceFinish();
      this.frameId = requestAnimationFrame((next) => this.loop(next));
    }

    updateDynamic(time) {
      const t = time / 1000;
      for (const item of this.dynamicObstacles) {
        if (item.kind === 'spin') {
          Body.setAngle(item.body, item.body.angle + item.speed);
        } else if (item.kind === 'swing') {
          Body.setAngle(item.body, item.baseAngle + Math.sin(t * item.speed + item.phase) * item.amplitude);
        } else {
          Body.setPosition(item.body, {
            x: item.baseX + Math.sin(t * 1.15 + item.phase) * item.span,
            y: item.y
          });
          Body.setAngle(item.body, Math.sin(t + item.phase) * 0.18);
        }
      }
    }

    applySafety(time) {
      for (const p of this.participants) {
        const body = p.body;
        if (!body || p.finished) continue;
        const y = body.position.y;
        const path = this.pathAt(y);
        const leftLimit = path.center - path.width / 2 + BALL_RADIUS + 8;
        const rightLimit = path.center + path.width / 2 - BALL_RADIUS - 8;
        const nearWall = body.position.x < leftLimit + 12 || body.position.x > rightLimit - 12;
        p.checkpoint = Math.max(p.checkpoint, this.checkpointForY(y));
        if (body.position.x < -55 || body.position.x > COURSE.width + 55 || y > COURSE.height + 80) {
          const safeY = Math.min(COURSE.finishY - 80, Math.max(80, y - 120));
          const safePath = this.pathAt(safeY);
          Body.setPosition(body, { x: safePath.center + (this.random() - 0.5) * Math.min(90, safePath.width * 0.35), y: safeY });
          Body.setVelocity(body, { x: (this.random() - 0.5) * 2, y: 3 });
        }
        const speed = Vector.magnitude(body.velocity);
        const movedY = Math.abs(y - (p.lastSafetyY || y));
        if (movedY > 2 || speed > 0.55) {
          p.lastSafetyY = y;
          p.stalledSince = time;
        } else if (!p.stalledSince) {
          p.stalledSince = time;
          p.lastSafetyY = y;
        }
        const stalledFor = time - p.stalledSince;
        if (nearWall) {
          const centerPull = Math.max(-0.0032, Math.min(0.0032, (path.center - body.position.x) * 0.00024));
          Body.applyForce(body, body.position, { x: centerPull, y: 0.0006 });
          if (body.velocity.y > 7.4) {
            Body.setVelocity(body, {
              x: body.velocity.x + Math.sign(path.center - body.position.x) * 0.65,
              y: 7.4
            });
          }
        }
        if (speed < 0.08 && time - this.startTime > 6000) {
          Body.applyForce(body, body.position, { x: (this.random() - 0.5) * 0.0014, y: 0.0028 });
        }
        if (stalledFor > STUCK_NUDGE_MS && time - this.startTime > 2500) {
          const centerPull = Math.max(-0.0035, Math.min(0.0035, (path.center - body.position.x) * 0.00026));
          Body.applyForce(body, body.position, { x: centerPull + (this.random() - 0.5) * 0.001, y: 0.0038 });
          Body.setAngularVelocity(body, body.angularVelocity + (this.random() - 0.5) * 0.08);
        }
        if (stalledFor > STUCK_RESCUE_MS && time - this.startTime > 4000) {
          const safeY = Math.min(COURSE.finishY - 95, y + 42);
          const safePath = this.pathAt(safeY);
          Body.setPosition(body, {
            x: safePath.center + (this.random() - 0.5) * Math.min(58, safePath.width * 0.22),
            y: safeY
          });
          Body.setVelocity(body, { x: (this.random() - 0.5) * 2.2, y: 4.2 });
          p.stalledSince = time;
          p.lastSafetyY = safeY;
        }
      }
    }

    checkpointForY(y) {
      return Math.max(0, Math.min(6, Math.floor(y / 360)));
    }

    updateCamera() {
      const running = this.participants.filter((p) => !p.finished && p.body);
      const leader = running.sort((a, b) => b.body.position.y - a.body.position.y)[0] || this.participants[0];
      const targetY = Math.max(0, Math.min(COURSE.finishY - this.viewHeight * 0.72, leader.body.position.y - this.viewHeight * 0.34));
      this.cameraY += (targetY - this.cameraY) * 0.08;
      this.shake *= 0.86;
    }

    updateRanking(force) {
      const ordered = [...this.participants].sort((a, b) => this.progressOf(b) - this.progressOf(a));
      ordered.forEach((p, i) => { p.liveRank = i + 1; });
      const leader = ordered[0];
      ui.currentLeader.textContent = leader ? `#${leader.number} ${leader.name}` : '대기 중';
      if (!force && ui.liveRanking.childElementCount === ordered.length) {
        ordered.forEach((p, i) => {
          const row = ui.liveRanking.children[i];
          row.classList.toggle('leader', i === 0);
          row.querySelector('.rank-num').textContent = `${i + 1}`;
          row.querySelector('.rank-name').textContent = `#${p.number} ${p.name}`;
          row.querySelector('.marble-dot').style.color = p.color;
          row.querySelector('.marble-dot').style.background = p.color;
        });
        return;
      }
      ui.liveRanking.innerHTML = ordered.map((p, i) => `
        <li class="${i === 0 ? 'leader' : ''}">
          <span class="rank-num">${i + 1}</span>
          <span class="marble-dot" style="background:${p.color};color:${p.color}"></span>
          <span class="rank-name">#${p.number} ${escapeHtml(p.name)}</span>
        </li>
      `).join('');
    }

    progressOf(p) {
      if (p.finished) return 10000000 - p.rank;
      const y = p.body ? p.body.position.y : 0;
      const section = Math.max(0, Math.min(99999, y));
      p.progress = p.checkpoint * 100000 + section;
      return p.progress;
    }

    recordFinish(participant) {
      if (participant.finished) return;
      participant.finished = true;
      participant.rank = this.finishRecords.length + 1;
      participant.finishTime = performance.now();
      const elapsedTime = participant.finishTime - this.startTime;
      this.finishRecords.push({
        participantId: participant.id,
        rank: participant.rank,
        finishTime: participant.finishTime,
        elapsedTime
      });
      this.addParticles(participant.body.position.x, participant.body.position.y, participant.color, 18);
      ui.viewport.classList.add('flash');
      setTimeout(() => ui.viewport.classList.remove('flash'), 450);
      audio.beep(participant.rank === 1 ? 'win' : 'finish');
      if (this.finishRecords.length === this.participants.length) this.finish();
    }

    forceFinish() {
      const rest = this.participants
        .filter((p) => !p.finished)
        .sort((a, b) => this.progressOf(b) - this.progressOf(a));
      rest.forEach((p, index) => {
        p.finished = true;
        p.rank = this.finishRecords.length + 1;
        const elapsedTime = MAX_RACE_MS + index * 750;
        p.finishTime = this.startTime + elapsedTime;
        this.finishRecords.push({ participantId: p.id, rank: p.rank, finishTime: p.finishTime, elapsedTime });
      });
      this.finish();
    }

    finish() {
      if (this.state === GameState.FINISHED) return;
      this.state = GameState.FINISHED;
      cancelAnimationFrame(this.frameId);
      ui.raceStateText.textContent = 'FINISHED';
      this.render(performance.now());
      const result = this.getResults();
      saveLocal({ lastSeed: this.seed, lastResults: result, names: this.participants.map((p) => p.name) });
      setTimeout(() => showResults(result), 700);
    }

    getResults() {
      return this.finishRecords
        .slice()
        .sort((a, b) => a.rank - b.rank)
        .map((record) => {
          const participant = this.participants.find((p) => p.id === record.participantId);
          return { ...record, name: participant.name, number: participant.number, color: participant.color };
        });
    }

    addParticles(x, y, color, amount) {
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      const max = Math.min(amount, 80 - this.particles.length);
      for (let i = 0; i < max; i += 1) {
        this.particles.push({
          x, y,
          vx: (this.random() - 0.5) * 4,
          vy: (this.random() - 0.8) * 4,
          life: 480 + this.random() * 420,
          maxLife: 900,
          color
        });
      }
    }

    updateParticles(delta) {
      this.particles = this.particles.filter((p) => {
        p.life -= delta;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        return p.life > 0;
      });
    }

    resize() {
      const rect = ui.viewport.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      ui.canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      ui.canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.viewWidth = rect.width || 390;
      this.viewHeight = rect.height || 600;
      this.scale = this.viewWidth / COURSE.width;
      if (this.state !== GameState.SETUP) this.render(performance.now());
    }

    render(time) {
      const width = this.viewWidth;
      const height = this.viewHeight;
      const scale = this.scale;
      const shakeX = (this.random() - 0.5) * this.shake;
      const shakeY = (this.random() - 0.5) * this.shake;
      ctx.save();
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#070a12';
      ctx.fillRect(0, 0, width, height);
      ctx.translate(shakeX, shakeY);
      ctx.scale(scale, scale);
      ctx.translate(0, -this.cameraY);

      this.drawCourseBackground();
      for (const body of Composite.allBodies(this.engine.world)) this.drawBody(body, time);
      this.drawParticles();
      ctx.restore();
    }

    drawCourseBackground() {
      const grd = ctx.createLinearGradient(0, this.cameraY, 0, this.cameraY + COURSE.height);
      grd.addColorStop(0, '#08111d');
      grd.addColorStop(1, '#050710');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, COURSE.width, COURSE.height);

      const left = [];
      const right = [];
      for (let y = -80; y <= COURSE.height + 80; y += 28) {
        const p = this.pathAt(Math.max(0, Math.min(COURSE.height, y)));
        left.push({ x: p.center - p.width / 2, y });
        right.push({ x: p.center + p.width / 2, y });
      }
      ctx.beginPath();
      left.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      right.reverse().forEach((p) => ctx.lineTo(p.x, p.y));
      ctx.closePath();
      const lane = ctx.createLinearGradient(0, this.cameraY, COURSE.width, this.cameraY + 600);
      lane.addColorStop(0, 'rgba(84,240,255,0.12)');
      lane.addColorStop(0.52, 'rgba(255,79,216,0.10)');
      lane.addColorStop(1, 'rgba(184,255,95,0.08)');
      ctx.fillStyle = lane;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = 'rgba(84,240,255,0.12)';
      ctx.lineWidth = 1;
      for (let y = 0; y < COURSE.height; y += 80) {
        ctx.beginPath();
        const p = this.pathAt(y);
        ctx.moveTo(p.center - p.width / 2 + 18, y);
        ctx.lineTo(p.center + p.width / 2 - 18, y);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.font = '800 13px system-ui';
      ['START', 'SPLIT', 'SPIN', 'BUMPERS', 'TILT', 'FINISH'].forEach((label, i) => {
        ctx.fillText(label, 18, 80 + i * 380);
      });
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 5;
      const finishPath = this.pathAt(COURSE.finishY);
      ctx.beginPath();
      ctx.moveTo(finishPath.center - finishPath.width / 2 + 20, COURSE.finishY);
      ctx.lineTo(finishPath.center + finishPath.width / 2 - 20, COURSE.finishY);
      ctx.stroke();
      ctx.fillStyle = '#ffd166';
      ctx.font = '1000 18px system-ui';
      ctx.fillText('FINISH', 158, COURSE.finishY - 14);
    }

    drawBody(body, time) {
      const tag = body.renderTag;
      if (tag === 'guard') return;
      if (tag === 'ball') return this.drawBall(body, time);
      if (tag === 'finish') return;
      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.rotate(body.angle);
      if (tag === 'peg') {
        this.drawCircle(0, 0, body.circleRadius, '#1a2436', '#54f0ff');
      } else if (tag === 'bumper') {
        this.drawCircle(0, 0, body.circleRadius, '#29162f', '#ff4fd8');
      } else {
        const bounds = body.bounds;
        const w = bounds.max.x - bounds.min.x;
        const h = bounds.max.y - bounds.min.y;
        ctx.fillStyle = tag === 'spinner' ? '#17293a' : tag === 'mover' ? '#263018' : '#151d2d';
        ctx.strokeStyle = tag === 'spinner' ? '#ff4fd8' : '#54f0ff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-w / 2, -h / 2, w, h, 5);
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    drawCircle(x, y, r, fill, stroke) {
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    drawBall(body, time) {
      const p = body.participant;
      const isLeader = p.liveRank === 1 && !p.finished;
      ctx.save();
      ctx.translate(body.position.x, body.position.y);
      ctx.rotate(body.angle);
      const glow = isLeader ? 24 + Math.sin(time / 120) * 6 : 10;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = glow;
      const grad = ctx.createRadialGradient(-6, -7, 3, 0, 0, BALL_RADIUS);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.22, p.color);
      grad.addColorStop(1, '#111827');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, BALL_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isLeader ? '#ffffff' : 'rgba(255,255,255,0.72)';
      ctx.lineWidth = isLeader ? 3 : 1.4;
      ctx.stroke();
      ctx.fillStyle = '#071018';
      ctx.font = '1000 10px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(p.number), 0, -1);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#f7fbff';
      ctx.strokeStyle = 'rgba(0,0,0,0.72)';
      ctx.lineWidth = 3;
      ctx.font = '900 10px system-ui';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const label = `${p.number} ${p.shortName}`;
      ctx.strokeText(label, body.position.x, body.position.y - BALL_RADIUS - 5);
      ctx.fillText(label, body.position.x, body.position.y - BALL_RADIUS - 5);
      ctx.restore();
    }

    drawParticles() {
      for (const p of this.particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    cleanup() {
      cancelAnimationFrame(this.frameId);
      if (this.engine) {
        Composite.clear(this.engine.world, false);
        Engine.clear(this.engine);
      }
      this.engine = null;
    }
  }

  const audio = new AudioManager();
  const game = new RaceGame();

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));
  }

  function readLocal() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch {
      return {};
    }
  }

  function saveLocal(patch) {
    const next = { ...readLocal(), ...patch };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
  }

  function showScreen(name) {
    ui.setupScreen.classList.toggle('active', name === 'setup');
    ui.raceScreen.classList.toggle('active', name === 'race');
    ui.resultScreen.classList.toggle('active', name === 'result');
  }

  function validateInput() {
    const names = normalizeParticipants(ui.input.value);
    ui.participantCount.textContent = `${names.length}명`;
    ui.participantPreview.innerHTML = names.map((name, index) => (
      `<span class="participant-chip" style="border-color:${COLORS[index % COLORS.length]}66">#${index + 1} ${escapeHtml(name)}</span>`
    )).join('');

    let error = '';
    if (names.length < 2) error = '참가자는 최소 2명이 필요합니다.';
    if (ui.input.value.split(/\n+/).map(sanitizeName).filter(Boolean).length > 16) error = '최대 16명까지만 참가할 수 있습니다.';
    ui.setupError.textContent = error;
    ui.startButton.disabled = Boolean(error);
    return { names, valid: !error };
  }

  function startRace() {
    const { names, valid } = validateInput();
    if (!valid) return;
    audio.activate();
    saveLocal({ names });
    game.prepare(names);
  }

  function showResults(results) {
    const winner = results[0];
    ui.winnerName.textContent = winner ? `#${winner.number} ${winner.name}` : '기록 없음';
    ui.resultMeta.textContent = `SEED ${game.seed} · ${new Date().toLocaleString('ko-KR')}`;
    ui.podium.innerHTML = results.slice(0, 3).map((r, index) => {
      const rankClass = index === 0 ? 'first' : '';
      return `
        <div class="podium-card ${rankClass}">
          <span class="medal">${r.rank}</span>
          <span class="podium-name">#${r.number} ${escapeHtml(r.name)}</span>
          <span class="hint">${formatTime(r.elapsedTime)}</span>
        </div>
      `;
    }).join('');
    ui.resultRows.innerHTML = results.map((r) => `
      <tr>
        <td>${r.rank}</td>
        <td><span class="marble-dot" style="display:inline-block;background:${r.color};color:${r.color};vertical-align:middle;margin-right:7px"></span>#${r.number} ${escapeHtml(r.name)}</td>
        <td>${formatTime(r.elapsedTime)}</td>
      </tr>
    `).join('');
    confettiBurst();
    showScreen('result');
  }

  function confettiBurst() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    ui.resultScreen.animate([
      { filter: 'brightness(1.55)' },
      { filter: 'brightness(1)' }
    ], { duration: 700, easing: 'ease-out' });
  }

  async function saveResultImage() {
    const results = game.getResults().length ? game.getResults() : readLocal().lastResults || [];
    if (!results.length) return;
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350;
    const c = canvas.getContext('2d');
    const gradient = c.createLinearGradient(0, 0, 1080, 1350);
    gradient.addColorStop(0, '#08111d');
    gradient.addColorStop(0.5, '#140d22');
    gradient.addColorStop(1, '#05060a');
    c.fillStyle = gradient;
    c.fillRect(0, 0, 1080, 1350);
    c.fillStyle = 'rgba(84,240,255,0.18)';
    c.fillRect(0, 0, 1080, 10);
    c.fillStyle = '#54f0ff';
    c.font = '900 34px system-ui';
    c.fillText('NEON DROP RACE', 70, 96);
    c.fillStyle = '#f7fbff';
    c.font = '1000 74px system-ui';
    c.fillText(`WINNER #${results[0].number}`, 70, 190);
    c.fillText(results[0].name, 70, 278);
    c.fillStyle = '#9aa9bc';
    c.font = '700 28px system-ui';
    c.fillText(`${new Date().toLocaleString('ko-KR')} · SEED ${game.seed || readLocal().lastSeed || '-'}`, 70, 335);
    results.forEach((r, i) => {
      const y = 430 + i * 62;
      c.fillStyle = i < 3 ? '#ffd166' : '#f7fbff';
      c.font = '900 34px system-ui';
      c.fillText(`${r.rank}`, 80, y);
      c.fillStyle = r.color;
      c.beginPath();
      c.arc(150, y - 10, 18, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#f7fbff';
      c.fillText(`#${r.number} ${r.name}`, 190, y);
      c.fillStyle = '#9aa9bc';
      c.fillText(formatTime(r.elapsedTime), 820, y);
    });

    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], 'neon-drop-race-result.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Neon Drop Race 결과' });
      } else {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'neon-drop-race-result.png';
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }
    }, 'image/png');
  }

  function bindUI() {
    ui.input.addEventListener('input', validateInput);
    ui.startButton.addEventListener('click', startRace);
    ui.sampleButton.addEventListener('click', () => {
      ui.input.value = SAMPLE_NAMES.join('\n');
      validateInput();
    });
    ui.resetButton.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      ui.input.value = SAMPLE_NAMES.slice(0, 4).join('\n');
      audio.restore(true);
      validateInput();
    });
    ui.soundButton.addEventListener('click', () => audio.toggle());
    ui.fullscreenButton.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
    ui.rerunButton.addEventListener('click', () => startRace());
    ui.editButton.addEventListener('click', () => showScreen('setup'));
    ui.saveImageButton.addEventListener('click', saveResultImage);
    window.addEventListener('pagehide', () => game.cleanup());
  }

  function boot() {
    bindUI();
    const saved = readLocal();
    audio.restore(saved.soundEnabled);
    ui.input.value = (saved.names && saved.names.length ? saved.names : SAMPLE_NAMES.slice(0, 4)).join('\n');
    validateInput();
    showScreen('setup');
  }

  boot();
})();

</script>
